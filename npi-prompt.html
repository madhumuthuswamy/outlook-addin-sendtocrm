<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Track Email to CRM</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="config.js?v=20261126b"></script>
  <style>
    :root {
      color-scheme: light;
      --surface: #ffffff;
      --text: #242424;
      --secondary-text: #605e5c;
      --border: #8a8886;
      --input-surface: #ffffff;
      --error: #a4262c;
      --primary: #1683f7;
      --primary-text: #ffffff;
      --button-surface: #ffffff;
      --focus: #0f6cbd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --surface: #292929;
        --text: #f3f2f1;
        --secondary-text: #d2d0ce;
        --border: #a19f9d;
        --input-surface: #1f1f1f;
        --error: #ffb4ab;
        --primary: #479ef5;
        --primary-text: #1f1f1f;
        --button-surface: #292929;
        --focus: #479ef5;
      }
    }
    html, body {
      overflow-y: auto;
    }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      padding: 22px 28px;
      margin: 0;
      background: var(--surface);
      color: var(--text);
    }
    .dialog-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }
    .dialog-icon {
      color: var(--primary);
      font-size: 30px;
      line-height: 1;
    }
    .dialog-title {
      font-size: 24px;
      font-weight: 600;
    }
    label {
      display: block;
      margin-bottom: 6px;
      width: 94%;
      margin-left: auto;
      margin-right: auto;
      font-weight: 600;
      font-size: 16px;
    }
    input, select {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      box-sizing: border-box;
      color: var(--text);
      background: var(--input-surface);
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    select { margin-top: 8px; }
    .npi-row {
      --action-width: 190px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--action-width);
      align-items: center;
      gap: 8px;
      width: 96%;
      margin-left: auto;
      margin-right: auto;
    }
    .npi-row input {
      width: 100%;
    }
    #searchBtn {
      margin: 0;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary);
      color: var(--primary-text);
      border: 1px solid var(--primary);
      border-radius: 4px;
      font-weight: 600;
    }
    .search-icon {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      border: 2px solid currentColor;
      border-radius: 50%;
      position: relative;
      box-sizing: border-box;
    }
    .search-icon::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 2px;
      right: -5px;
      bottom: -3px;
      background: currentColor;
      transform: rotate(45deg);
      transform-origin: left center;
      border-radius: 1px;
    }
    .account-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      width: 96%;
      margin-left: auto;
      margin-right: auto;
    }
    .account-row select {
      grid-column: 1;
      width: 100%;
    }
    input:focus, select:focus, button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }
    .status, .error {
      font-size: 12px;
      margin-top: 6px;
      margin-bottom: 6px;
      width: 94%;
      margin-left: auto;
      margin-right: auto;
      box-sizing: border-box;
    }
    .account-label {
      margin-top: 34px;
      margin-bottom: 8px;
    }
    .account-results {
      width: 96%;
      margin: 0 auto;
      border: 1px solid var(--primary);
      border-radius: 5px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .account-card {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      width: 100%;
      padding: 13px 16px;
      text-align: left;
      color: var(--text);
      background: var(--surface);
      border: 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      box-sizing: border-box;
    }
    .account-radio {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      margin: 3px 0 0;
      accent-color: var(--primary);
    }
    .account-card-content {
      min-width: 0;
    }
    .account-card:last-child {
      border-bottom: 0;
    }
    .account-card:hover,
    .account-card.selected {
      background: #185a91;
      color: #ffffff;
    }
    .account-card-name {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 7px;
    }
    .account-card-details {
      display: block;
      color: var(--secondary-text);
      font-size: 14px;
    }
    .account-card.selected .account-card-details,
    .account-card:hover .account-card-details {
      color: #dceeff;
    }
    .results-hint {
      width: 96%;
      margin: 10px auto 0;
      color: var(--secondary-text);
      font-size: 12px;
    }
    .hidden-select {
      display: none;
    }
    .account-placeholder {
      padding: 13px 16px;
      color: var(--secondary-text);
      font-size: 14px;
    }
    .status:empty, .error:empty {
      display: none;
    }
    .status { color: var(--secondary-text); }
    .error { color: var(--error); }
    .buttons { margin-top: 28px; text-align: right; }
    button {
      padding: 5px 12px;
      margin-left: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    #okBtn {
      background-color: var(--primary);
      color: var(--primary-text);
      border: 1px solid var(--primary);
      border-radius: 2px;
    }
    #okBtn:disabled {
      background-color: var(--button-surface);
      color: var(--secondary-text);
      border-color: var(--border);
      opacity: 0.65;
    }
    #cancelBtn, #searchBtn {
      background-color: var(--button-surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="dialog-header">
    <span class="dialog-icon" aria-hidden="true">&#9993;</span>
    <span class="dialog-title">Track Email to CRM</span>
  </div>
  <label for="npiInput">Enter Provider NPI # (10 digits) *</label>
  <div class="npi-row">
    <input id="npiInput" type="text" maxlength="10" inputmode="numeric"
      autocomplete="off" placeholder="e.g. 1234567890" />
    <button id="searchBtn" type="button" disabled>
      <span class="search-icon" aria-hidden="true"></span>
      <span>Find Provider</span>
    </button>
  </div>
  <div id="statusMsg" class="status"></div>
  <div id="errorMsg" class="error"></div>
  <label class="account-label" for="accountSelect">Provider Account *</label>
  <div class="account-row">
    <select id="accountSelect" class="hidden-select" aria-label="Provider Account" disabled>
      <option value="">Select Provider Account</option>
    </select>
  </div>
  <div id="accountResults" class="account-results" aria-label="Provider Accounts">
    <div class="account-placeholder">Select Provider Account</div>
  </div>
  <div id="resultsHint" class="results-hint"></div>
  <div class="buttons">
    <button id="cancelBtn" type="button">Cancel</button>
    <button id="okBtn" type="button" disabled>Track &amp; Create Case</button>
  </div>

  <script>
    var config = window.OUTLOOK_ADDIN_CONFIG || {};
    var selectedAccount = null;
    var isSearching = false;

    Office.onReady(function () {
      var input = document.getElementById("npiInput");
      var params = new URLSearchParams(window.location.search);
      var suggested = (params.get("npi") || "").replace(/\D/g, "").slice(0, 10);
      if (suggested) {
        input.value = suggested;
      }
      updateSearchButtonState();
      updateNpiGuidance();
      document.getElementById("searchBtn").addEventListener("click", searchAccounts);
      document.getElementById("okBtn").addEventListener("click", submitSelection);
      document.getElementById("cancelBtn").addEventListener("click", cancelDialog);
      input.addEventListener("input", function () {
        input.value = input.value.replace(/\D/g, "").slice(0, 10);
        clearAccounts();
        clearMessages();
        updateSearchButtonState();
        updateNpiGuidance();
      });
      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") searchAccounts();
      });
      input.focus();
      input.select();
    });

    async function searchAccounts() {
      if (isSearching) return;
      var npi = document.getElementById("npiInput").value.trim();
      if (!/^\d{10}$/.test(npi)) {
        setError("NPI # must contain exactly 10 numeric digits.");
        updateNpiGuidance();
        updateSearchButtonState();
        return;
      }
      isSearching = true;
      clearAccounts();
      clearMessages();
      setStatus("Searching Provider Accounts...");
      document.getElementById("searchBtn").disabled = true;
      try {
        if (!config.accountSearchFlowUrl) {
          throw new Error("Account search is not configured.");
        }
        document.getElementById("npiInput").disabled = true;
        var response = await fetch(config.accountSearchFlowUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ npiNumber: npi })
        });
        var rawText = await response.text();
        var result = null;
        if (rawText) {
          try {
            result = JSON.parse(rawText);
          } catch (parseError) {
            if (response.ok) {
              throw new Error("Account search returned an invalid response.");
            }
          }
        }
        if (!response.ok) {
          var httpErrorBody = result && (result.body || result);
          var httpErrorMessage = httpErrorBody && (
            httpErrorBody.message ||
            (httpErrorBody.error && httpErrorBody.error.message)
          );
          throw new Error(
            httpErrorMessage
              ? "Account search failed. HTTP " + response.status + ": " + httpErrorMessage
              : "Account search failed. HTTP " + response.status + "."
          );
        }
        if (!result) {
          throw new Error("Account search failed. HTTP " + response.status + ".");
        }

        result = result.body || result;
        var resultStatus = String(result.status || "").toLowerCase();
        var accounts = result.accounts;
        if (typeof accounts === "string") {
          try {
            accounts = JSON.parse(accounts);
          } catch (parseError) {
            throw new Error("Account search returned an invalid account list.");
          }
        }

        if (resultStatus === "error" || resultStatus === "invalid_request") {
          throw new Error(result.message || "Account search failed.");
        }
        if (resultStatus === "not_found" || !Array.isArray(accounts) || accounts.length === 0) {
          setStatus("");
          setError("No Provider Account was found for NPI # " + npi + ".");
          return;
        }
        populateAccounts(accounts);
        setStatus(accounts.length + " Provider Account(s) found. Select one to continue.");
      } catch (error) {
        setStatus("");
        setError(error.message || "Unable to search Provider Accounts.");
      } finally {
        isSearching = false;
        document.getElementById("npiInput").disabled = false;
        updateSearchButtonState();
      }
    }

    function updateSearchButtonState() {
      var npi = document.getElementById("npiInput").value.trim();
      document.getElementById("searchBtn").disabled = isSearching || !/^\d{10}$/.test(npi);
    }

    function updateNpiGuidance() {
      if (isSearching) {
        setStatus("Searching Provider Accounts...");
        return;
      }

      var npi = document.getElementById("npiInput").value.trim();
      var digitCount = npi.length;
      if (digitCount === 0) {
        setStatus("Enter a 10-digit numeric NPI #.");
      } else if (digitCount < 10) {
        var remaining = 10 - digitCount;
        setStatus(
          digitCount + " of 10 digits entered. " +
          remaining + (remaining === 1 ? " more digit is" : " more digits are") +
          " required."
        );
      } else {
        setStatus("10 of 10 digits entered. NPI # is valid. Click Find Provider.");
      }
    }

    function populateAccounts(accounts) {
      var select = document.getElementById("accountSelect");
      var results = document.getElementById("accountResults");
      select.innerHTML = '<option value="">Select Provider Account</option>';
      results.innerHTML = "";
      accounts.forEach(function (account) {
        if (!account || !account.accountId || !account.accountName) return;
        var option = document.createElement("option");
        option.value = account.accountId;
        option.textContent = account.accountName +
          (account.providerType ? " - " + account.providerType : "");
        option.dataset.accountName = account.accountName;
        option.dataset.npiNumber = account.npiNumber || document.getElementById("npiInput").value;
        option.dataset.providerType = account.providerType || "";
        select.appendChild(option);

        var card = document.createElement("label");
        card.className = "account-card";
        card.dataset.accountId = account.accountId;
        card.dataset.accountName = account.accountName;
        card.dataset.npiNumber = account.npiNumber || document.getElementById("npiInput").value;
        card.dataset.providerType = account.providerType || "";
        var radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "providerAccount";
        radio.className = "account-radio";
        radio.value = account.accountId;
        radio.setAttribute("aria-label", account.accountName);
        var content = document.createElement("span");
        content.className = "account-card-content";
        var name = document.createElement("span");
        name.className = "account-card-name";
        name.textContent = account.accountName;
        var details = document.createElement("span");
        details.className = "account-card-details";
        details.textContent = "NPI: " + card.dataset.npiNumber +
          (account.providerType ? "  •  Type: " + account.providerType : "");
        content.appendChild(name);
        content.appendChild(details);
        card.appendChild(radio);
        card.appendChild(content);
        card.addEventListener("click", function () {
          selectAccount(card);
        });
        results.appendChild(card);
      });
      select.disabled = select.options.length <= 1;
      document.getElementById("resultsHint").textContent =
        select.options.length > 1 ? "Select one provider account to continue." : "";
    }

    function selectAccount(card) {
      if (!card || !card.dataset.accountId) return;
      document.querySelectorAll(".account-card").forEach(function (item) {
        item.classList.remove("selected");
        var itemRadio = item.querySelector(".account-radio");
        if (itemRadio) itemRadio.checked = false;
      });
      card.classList.add("selected");
      var radio = card.querySelector(".account-radio");
      if (radio) radio.checked = true;
      selectedAccount = {
        accountId: card.dataset.accountId,
        accountName: card.dataset.accountName,
        npiNumber: card.dataset.npiNumber,
        providerType: card.dataset.providerType
      };
      document.getElementById("okBtn").disabled = !selectedAccount;
      clearMessages();
    }

    function submitSelection() {
      if (!selectedAccount) {
        setError("Select a Provider Account before continuing.");
        return;
      }
      Office.context.ui.messageParent(JSON.stringify({
        status: "ok",
        npiNumber: selectedAccount.npiNumber,
        accountId: selectedAccount.accountId,
        accountName: selectedAccount.accountName
      }));
    }

    function cancelDialog() {
      Office.context.ui.messageParent(JSON.stringify({ status: "cancel" }));
    }

    function clearAccounts() {
      selectedAccount = null;
      var select = document.getElementById("accountSelect");
      select.innerHTML = '<option value="">Select Provider Account</option>';
      select.disabled = true;
      document.getElementById("accountResults").innerHTML =
        '<div class="account-placeholder">Select Provider Account</div>';
      document.getElementById("resultsHint").textContent = "";
      document.getElementById("okBtn").disabled = true;
    }

    function clearMessages() {
      setStatus("");
      setError("");
    }

    function setStatus(message) {
      document.getElementById("statusMsg").textContent = message || "";
    }

    function setError(message) {
      document.getElementById("errorMsg").textContent = message || "";
    }
  </script>
</body>
</html>
