<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enter NPI #</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      color-scheme: light;
      --surface: #ffffff;
      --text: #242424;
      --secondary-text: #605e5c;
      --border: #8a8886;
      --input-surface: #ffffff;
      --error: #a4262c;
      --primary: #0f6cbd;
      --primary-text: #ffffff;
      --button-surface: #ffffff;
      --focus: #0f6cbd;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --surface: #292929;
        --text: #f3f2f1;
        --secondary-text: #d2d0ce;
        --border: #a19f9d;
        --input-surface: #1f1f1f;
        --error: #ffb4ab;
        --primary: #479ef5;
        --primary-text: #1f1f1f;
        --button-surface: #292929;
        --focus: #479ef5;
      }
    }

    @media (forced-colors: active) {
      :root {
        color-scheme: normal;
        --surface: Canvas;
        --text: CanvasText;
        --secondary-text: GrayText;
        --border: ButtonText;
        --input-surface: Field;
        --error: LinkText;
        --primary: Highlight;
        --primary-text: HighlightText;
        --button-surface: ButtonFace;
        --focus: Highlight;
      }
    }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background: var(--surface);
      color: var(--text);
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }
    input {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      box-sizing: border-box;
      color: var(--text);
      background: var(--input-surface);
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    input::placeholder {
      color: var(--secondary-text);
      opacity: 1;
    }
    input:focus,
    button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }
    .error {
      color: var(--error);
      font-size: 12px;
      margin-top: 6px;
      min-height: 16px;
    }
    .hint {
      color: var(--secondary-text);
      font-size: 12px;
      margin-top: 6px;
      min-height: 16px;
      font-style: italic;
    }
    .buttons {
      margin-top: 10px;
      text-align: right;
    }
    button {
      padding: 5px 12px;
      margin-left: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    #okBtn {
      background-color: var(--primary);
      color: var(--primary-text);
      border: 1px solid var(--primary);
      border-radius: 2px;
    }
    #cancelBtn {
      background-color: var(--button-surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <label for="npiInput">Enter NPI # (10 digits) *</label>
  <input id="npiInput" type="text" maxlength="10" inputmode="numeric" autocomplete="off" placeholder="e.g. 1234567890" />
  <div id="hintMsg" class="hint"></div>
  <div id="errorMsg" class="error"></div>
  <div class="buttons">
    <button id="cancelBtn" type="button">Cancel</button>
    <button id="okBtn" type="button">OK</button>
  </div>

  <script>
    Office.onReady(function () {
      var input = document.getElementById("npiInput");

      // Pre-fill with a candidate NPI # detected by the host page from the
      // email's subject/body (passed as a query parameter), if any. The
      // user can still edit or clear it before confirming.
      var params = new URLSearchParams(window.location.search);
      var suggested = (params.get("npi") || "").replace(/\D/g, "").slice(0, 10);
      if (suggested) {
        input.value = suggested;
        document.getElementById("hintMsg").textContent = "We found this NPI # in the email. Please confirm it's correct, or edit it below.";
      }

      document.getElementById("okBtn").addEventListener("click", submitNpi);
      document.getElementById("cancelBtn").addEventListener("click", cancelDialog);

      input.addEventListener("input", function () {
        // Allow digits only, capped at 10 characters.
        input.value = input.value.replace(/\D/g, "").slice(0, 10);
        document.getElementById("hintMsg").textContent = "";
      });

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          submitNpi();
        }
      });

      input.focus();
      input.select();
    });

    function submitNpi() {
      var value = document.getElementById("npiInput").value.trim();
      var errorEl = document.getElementById("errorMsg");

      if (!/^\d{10}$/.test(value)) {
        errorEl.textContent = "NPI # is required and must be exactly 10 digits.";
        return;
      }

      errorEl.textContent = "";
      Office.context.ui.messageParent(JSON.stringify({ status: "ok", npi: value }));
    }

    function cancelDialog() {
      Office.context.ui.messageParent(JSON.stringify({ status: "cancel" }));
    }
  </script>
</body>
</html>
